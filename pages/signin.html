<!DOCTYPE html>
<html class="min-h-full bg-gradient-to-b from-[#F0F4F8] to-slate-200 bg-fixed" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>FormPilotX - Sign In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#2563eb",
                        "primary": "#004ac6",
                        "slate-50": "#f8fafc",
                        "slate-100": "#f1f5f9",
                        "slate-200": "#e2e8f0",
                        "slate-300": "#cbd5e1",
                        "slate-400": "#94a3b8",
                        "slate-500": "#64748b",
                        "slate-600": "#475569",
                        "slate-700": "#334155",
                        "slate-800": "#1e293b",
                        "slate-900": "#0f172a",
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            min-height: 100vh;
            background-attachment: fixed;
        }
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#F0F4F8] to-slate-200 bg-fixed flex items-center justify-center p-3 sm:p-4 py-6 sm:py-8 overflow-y-auto box-border">
    <!-- Auth Card Container (Generous Height Padding to Match Signup Card Visual Weight) -->
    <main class="w-full max-w-[410px] mx-auto bg-white rounded-xl border border-slate-200/90 shadow-[0_8px_20px_-4px_rgba(0,0,0,0.06)] py-8 px-6 sm:py-9 sm:px-7 flex flex-col box-border my-auto overflow-visible shrink-0">
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <div class="flex items-center justify-center mb-3 gap-2.5 pt-0.5 shrink-0">
                <svg class="w-8 h-8 flex-shrink-0" width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="formpilotx-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#2563EB" />
                            <stop offset="45%" stop-color="#0284C7" />
                            <stop offset="85%" stop-color="#06B6D4" />
                            <stop offset="100%" stop-color="#00F0FF" />
                        </linearGradient>
                    </defs>
                    <path d="M90 12 L12 48 L32 86 L48 64 L65 82 L90 12 Z" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M90 12 L48 64" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 43 L65 82" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M32 86 L74 27" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M48 64 L32 86" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="text-xl font-extrabold tracking-tight uppercase" style="font-size: 21px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">FORMPILOT<span class="text-cyan-500">X</span></span>
            </div>
            <h1 class="text-lg font-bold text-slate-900 leading-snug">Welcome back</h1>
            <p class="text-xs text-slate-500 mt-1">Sign in to continue to your workspace</p>
        </div>

        <!-- Form -->
        <form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
            <!-- Email Input -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-700" for="email">Email Address</label>
                <input class="w-full h-10 px-3 border border-slate-300 rounded-lg text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="email" name="email" placeholder="name@example.com" required type="email">
            </div>

            <!-- Password Input -->
            <div class="flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-700" for="password">Password</label>
                    <a class="text-[11px] text-blue-600 hover:text-blue-700 hover:underline font-medium transition-colors" href="#">Forgot password?</a>
                </div>
                <div class="relative">
                    <input class="w-full h-10 pl-3 pr-9 border border-slate-300 rounded-lg text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="password" name="password" placeholder="••••••••" required type="password">
                    <button id="toggle_password" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none" type="button" aria-label="Toggle password visibility">
                        <span class="material-symbols-outlined text-lg">visibility_off</span>
                    </button>
                </div>
            </div>

            <!-- Submit Action -->
            <div class="pt-1.5">
                <button class="w-full h-10 bg-primary-container text-white text-xs font-semibold rounded-lg hover:bg-primary transition-colors focus:outline-none focus:ring-4 focus:ring-primary-container/20" type="submit">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Footer -->
        <div class="mt-6 text-center text-xs text-slate-600 shrink-0">
            Don't have an account? <a class="text-primary-container font-medium hover:underline" href="signup.html">Sign Up</a>
        </div>
    </main>

    <!-- Password Eye Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('toggle_password');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', function() {
                    const isPass = passwordInput.type === 'password';
                    passwordInput.type = isPass ? 'text' : 'password';
                    this.querySelector('.material-symbols-outlined').textContent = isPass ? 'visibility' : 'visibility_off';
                });
            }
        });
    </script>
</body>
</html>
