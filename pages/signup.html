<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Sign Up - FormPilotX</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {

            theme: {
                extend: {
                    "colors": {

                        "background": "#f8f9ff",
                        "inverse-primary": "#b4c5ff",
                        "outline": "#737686",

                        "inverse-surface": "#213145",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-bright": "#f8f9ff",
                        "outline-variant": "#c3c6d7",
                        "surface-tint": "#0053db",
                        "surface": "#f8f9ff",

                        "on-tertiary-container": "#ffede6",
                        "on-primary-fixed": "#00174b",
                        "on-surface": "#0b1c30",
                        "surface-container": "#e5eeff",
                        "surface-container-high": "#dce9ff",
                        "on-background": "#0b1c30",
                        "primary-fixed": "#dbe1ff",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container-low": "#eff4ff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#394c84",
                        "on-tertiary-fixed": "#360f00",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#31447b",
                        "on-primary-container": "#eeefff",
                        "primary-container": "#2563eb",
                        "primary": "#004ac6",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary": "#495c95",
                        "on-secondary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#434655",

                        "slate-800": "#1e293b",
                        "slate-900": "#0f172a",
                        "red-500": "#ef4444",
                        "red-600": "#dc2626",
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {

                        "margin-mobile": "16px",

                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],

                    },
                    "backgroundImage": {
                        "gradient-radial": "radial-gradient(var(--tw-gradient-stops))",

    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="h-full bg-gradient-to-b from-[#F0F4F8] to-slate-200 flex items-center justify-center p-4">
    <!-- Auth Card -->
    <div class="w-full max-w-[440px] bg-white rounded-[12px] border border-slate-200 shadow-[0_10px_25px_-5px_rgba(0,0,0,0.05)] p-[40px]">
        <!-- Header / Logo -->
        <div class="flex items-center justify-center mb-8 gap-3">
            <svg class="w-10 h-10 flex-shrink-0" width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="formpilotx-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2563EB" />
                        <stop offset="45%" stop-color="#0284C7" />
                        <stop offset="85%" stop-color="#06B6D4" />
                        <stop offset="100%" stop-color="#00F0FF" />
                    </linearGradient>
                </defs>
                <!-- Outer Paper Plane Body -->
                <path d="M90 12 L12 48 L32 86 L48 64 L65 82 L90 12 Z" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Central Fold Line -->
                <path d="M90 12 L48 64" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Internal 'X' Geometry Folds -->
                <path d="M22 43 L65 82" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M32 86 L74 27" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M48 64 L32 86" stroke="url(#formpilotx-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="text-2xl font-extrabold tracking-tight uppercase" style="font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -0.025em;">FORMPILOT<span style="color: #06B6D4;">X</span></span>
        </div>

        <!-- Title & Subtitle -->
        <div class="text-center mb-8">
            <h1 class="font-headline-lg text-headline-lg text-slate-900 mb-2">Create your account</h1>
            <p class="font-body-sm text-body-sm text-slate-500">Build smart forms. Automate complex workflows.</p>
        </div>

        <!-- Form -->
        <form class="flex flex-col gap-4">
            <!-- Full Name -->
            <div class="flex flex-col gap-1.5">
                <label class="font-label-md text-label-md text-slate-700" for="name">Full Name</label>
                <input class="w-full h-10 px-3 border border-slate-300 rounded-lg text-slate-900 font-body-sm text-body-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="name" placeholder="John Doe" type="text">
            </div>

            <!-- Email Address -->
            <div class="flex flex-col gap-1.5">
                <label class="font-label-md text-label-md text-slate-700" for="email">Email Address</label>
                <input class="w-full h-10 px-3 border border-slate-300 rounded-lg text-slate-900 font-body-sm text-body-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="email" placeholder="name@example.com" type="email">
            </div>

            <!-- Password -->
            <div class="flex flex-col gap-1.5">
                <label class="font-label-md text-label-md text-slate-700" for="password">Password</label>
                <div class="relative">
                    <input class="w-full h-10 pl-3 pr-10 border border-slate-300 rounded-lg text-slate-900 font-body-sm text-body-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="password" placeholder="••••••••" type="password">
                    <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none" type="button">
                        <span class="material-symbols-outlined text-xl">visibility_off</span>
                    </button>
                </div>
                <span class="font-label-sm text-label-sm text-slate-400 lowercase normal-case tracking-normal font-normal">Must be at least 8 characters</span>
            </div>

            <!-- Confirm Password (Error State) -->
            <div class="flex flex-col gap-1.5">
                <label class="font-label-md text-label-md text-slate-700" for="confirm_password">Confirm Password</label>
                <div class="relative">
                    <input class="w-full h-10 pl-3 pr-10 border border-red-500 rounded-lg text-slate-900 font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all" id="confirm_password" type="password" value="secret1">
                    <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none" type="button">
                        <span class="material-symbols-outlined text-xl">visibility_off</span>
                    </button>
                </div>
                <span class="font-label-sm text-label-sm text-red-600 lowercase normal-case tracking-normal font-normal">Passwords must match</span>
            </div>

            <!-- Submit Button -->
            <button class="w-full h-10 mt-2 bg-primary-container text-white font-label-md text-label-md rounded-lg hover:bg-primary transition-colors focus:outline-none focus:ring-4 focus:ring-primary-container/20" type="submit">
                Sign Up
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center font-body-sm text-body-sm text-slate-600">
            Already have an account? <a class="text-primary-container font-medium hover:underline" href="#">Sign In</a>
        </div>
    </div>
</body>
</html>
