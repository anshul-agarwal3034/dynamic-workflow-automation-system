<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormPilotX - Authentication & Form Management Application</title>
    <!-- React & ReactDOM Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <!-- Router & Modular Component Scripts -->
    <script type="text/babel" src="SimpleRouter.jsx"></script>
    <script type="text/babel" src="SharedComponents.jsx"></script>
    <script type="text/babel" src="formsApi.js"></script>
    <script type="text/babel" src="Signup.jsx"></script>
    <script type="text/babel" src="SignupVerify.jsx"></script>
    <script type="text/babel" src="Signin.jsx"></script>
    <script type="text/babel" src="ForgotPassword.jsx"></script>
    <script type="text/babel" src="ForgotVerify.jsx"></script>
    <script type="text/babel" src="ForgotReset.jsx"></script>
    <script type="text/babel" src="Home.jsx"></script>
    <script type="text/babel" src="FormsList.jsx"></script>
    <script type="text/babel" src="CreateFormPage.jsx"></script>
    <script type="text/babel" src="FormBuilder.jsx"></script>
    <script type="text/babel" src="FormDetail.jsx"></script>
    <script type="text/babel" src="FormPilotXAuth.jsx"></script>

    <!-- Mount React Application -->
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FormPilotXAuthApp />);
    </script>
</body>
</html>
